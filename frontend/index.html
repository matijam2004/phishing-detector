<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Threat Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --glass-bg:      rgba(255,255,255,0.05);
      --glass-border:  rgba(255,255,255,0.09);
      --text:          #e8f4ff;
      --text-muted:    rgba(185,213,228,0.6);
      --text-dim:      rgba(185,213,228,0.3);
      --danger-light:  rgba(239,68,68,0.12);
      --success-light: rgba(34,197,94,0.12);
    }

    html, body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      overflow-x: hidden;
      background:
        radial-gradient(circle at top right, #1f355f 0%, transparent 45%),
        linear-gradient(180deg, #0b1220 0%, #02050d 100%);
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
    }

    .page {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      z-index: 1;
    }

    .page-inner {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(90deg, #88a7b8 0%, #b9d5e4 30%, #f3fcff 50%, #b9d5e4 70%, #88a7b8 100%);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      animation: shimmer 8s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 300% 0; }
      50%  { background-position: 0 0; }
      100% { background-position: 300% 0; }
    }

    .header-sub {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 32px 64px rgba(0,0,0,0.7);
      overflow: hidden;
    }

    .card-body { padding: 28px; }

    .field-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 10px;
      display: block;
    }

    textarea {
      width: 100%;
      height: 190px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 0.88rem;
      font-family: inherit;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: rgba(136,167,184,0.5);
      box-shadow: 0 0 0 3px rgba(136,167,184,0.08);
    }

    textarea::placeholder { color: var(--text-dim); }

    .btn {
      margin-top: 14px;
      width: 100%;
      padding: 13px;
      background: linear-gradient(120deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      color: #ecf8ff;
      border: 1px solid rgba(215,239,255,0.28);
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.01em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(227,246,255,0.5);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
    }

    .btn:active:not(:disabled) { transform: scale(0.99); }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 10px;
    }

    .error-box {
      margin-top: 14px;
      padding: 12px 16px;
      background: var(--danger-light);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 10px;
      font-size: 0.83rem;
      color: #fca5a5;
      display: none;
    }

    .divider {
      height: 1px;
      background: var(--glass-border);
    }

    .result-panel {
      padding: 24px 28px;
      display: none;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: none; }
    }

    .result-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .verdict-text { flex: 1; }

    .verdict-label {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }

    .verdict-label.danger  { color: #f87171; }
    .verdict-label.success { color: #4ade80; }

    .verdict-conf {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .verdict-badge {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .verdict-badge.danger  { background: var(--danger-light);  color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
    .verdict-badge.success { background: var(--success-light); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .bar-row:last-child { margin-bottom: 0; }

    .bar-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      width: 68px;
      flex-shrink: 0;
      font-weight: 500;
    }

    .bar-track {
      flex: 1;
      height: 5px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.7s cubic-bezier(.4,0,.2,1);
    }

    .bar-fill.danger  { background: linear-gradient(90deg, #ef4444, #f87171); }
    .bar-fill.success { background: linear-gradient(90deg, #22c55e, #4ade80); }

    .bar-pct {
      font-size: 0.75rem;
      color: var(--text-muted);
      width: 40px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.02em;
    }

    @media (max-width: 480px) {
      .card-body { padding: 20px; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="page">
  <div class="page-inner">
    <div class="header">
      <h1>Email Threat Detection</h1>
      <p class="header-sub">Paste any email and the model classifies it instantly using machine learning.</p>
    </div>

    <div class="card">
      <div class="card-body">
        <label class="field-label" for="emailInput">Email content</label>
        <textarea id="emailInput" placeholder="Paste the full email here — subject, sender, body..."></textarea>
        <button class="btn" id="analyzeBtn" onclick="analyze()">
          <span id="btnText">Analyze Email</span>
          <div class="spinner" id="spinner"></div>
        </button>
        <p class="hint">Ctrl + Enter to analyze</p>
        <div class="error-box" id="errorBox"></div>
      </div>

      <div class="divider" id="divider" style="display:none"></div>

      <div class="result-panel" id="resultPanel">
        <div class="result-top">
          <div class="verdict-text">
            <div class="verdict-label" id="verdictLabel"></div>
            <div class="verdict-conf" id="verdictConf"></div>
          </div>
          <div class="verdict-badge" id="verdictBadge"></div>
        </div>
        <div class="bar-row">
          <span class="bar-name">Phishing</span>
          <div class="bar-track"><div class="bar-fill danger" id="phishingBar" style="width:0%"></div></div>
          <span class="bar-pct" id="phishingPct">0%</span>
        </div>
        <div class="bar-row">
          <span class="bar-name">Legitimate</span>
          <div class="bar-track"><div class="bar-fill success" id="legitBar" style="width:0%"></div></div>
          <span class="bar-pct" id="legitPct">0%</span>
        </div>
      </div>
    </div>

    <p class="footer">Trained on 82,000+ emails &mdash; scikit-learn + FastAPI &mdash; CS166 Project</p>
  </div>
  </div>

  <script>
    /* ── Flowing diagonal lines background ── */
    (function () {
      const canvas = document.getElementById("bg-canvas");
      const gl = canvas.getContext("webgl", { alpha: true }) || canvas.getContext("experimental-webgl", { alpha: true });
      if (!gl) return;

      const VS = `
        attribute vec2 a_pos;
        void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
      `;

      const FS = `
        precision highp float;
        uniform vec3  iResolution;
        uniform float iTime;

        float hash(float n) { return fract(sin(n) * 43758.5453); }

        void main() {
          vec2 uv = gl_FragCoord.xy / iResolution.xy;
          float aspect = iResolution.x / iResolution.y;
          vec2 p = vec2(uv.x * aspect, uv.y);

          /* rain angle: mostly vertical, slight lean to the right */
          /* project onto rain axis and perpendicular streak axis  */
          float angle = 0.22;                        /* radians — gentle lean */
          float cosA = cos(angle), sinA = sin(angle);
          float along  = p.x * sinA - p.y * cosA;   /* falls along this axis */
          float across = p.x * cosA + p.y * sinA;   /* stripe spacing axis   */

          /* streaks: thin vertical bands spaced across screen */
          float spacing = 0.038;
          float band = fract(across / spacing);
          float streak = smoothstep(0.0, 0.06, band) * smoothstep(1.0, 0.94, band);

          /* each band gets a unique speed and length via hash */
          float col   = floor(across / spacing);
          /* only ~45% of columns have an active drop */
          float active = step(0.55, hash(col + 33.1));
          float speed = 0.4 + hash(col) * 0.6;
          float phase = hash(col + 77.3);

          /* falling motion top-to-bottom: subtract time so drop moves downward */
          float fall  = fract(along * 1.8 - iTime * speed + phase * 10.0);

          /* streak head — bright tip, short fading tail */
          float head  = smoothstep(0.0, 0.03, fall);
          float tail  = smoothstep(0.22, 0.0, fall);
          float drop  = head * tail * active;

          /* secondary faint layer — sparser, slower */
          float spacing2 = spacing * 1.6;
          float col2   = floor(across / spacing2);
          float active2 = step(0.62, hash(col2 + 55.9));
          float speed2 = 0.25 + hash(col2 + 13.1) * 0.3;
          float phase2 = hash(col2 + 99.7);
          float fall2  = fract(along * 2.0 - iTime * speed2 + phase2 * 10.0);
          float drop2  = smoothstep(0.0, 0.03, fall2) * smoothstep(0.14, 0.0, fall2) * 0.25 * active2;

          float band2   = fract(across / spacing2);
          float streak2 = smoothstep(0.0, 0.08, band2) * smoothstep(1.0, 0.92, band2);

          float pattern = streak * drop + streak2 * drop2;

          /* colour: icy blue-white tips, deeper teal on body */
          vec3 tipColor  = vec3(0.72, 0.90, 1.00);
          vec3 bodyColor = vec3(0.15, 0.45, 0.65);
          vec3 lineColor = mix(bodyColor, tipColor, pow(drop, 0.5));

          /* vignette */
          vec2 vig = uv - 0.5;
          float vignette = 1.0 - dot(vig * vec2(1.0, 1.3), vig * vec2(1.0, 1.3)) * 2.0;
          vignette = clamp(vignette, 0.0, 1.0);

          float alpha = pattern * 0.55 * vignette;
          gl_FragColor = vec4(lineColor, alpha);
        }
      `;

      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }

      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0, 0, 0, 0);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "a_pos");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      const uRes  = gl.getUniformLocation(prog, "iResolution");
      const uTime = gl.getUniformLocation(prog, "iTime");

      let W, H, start = performance.now();

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
        gl.viewport(0, 0, W, H);
      }

      window.addEventListener("resize", resize);
      resize();

      function frame() {
        const t = (performance.now() - start) / 1000;
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform3f(uRes, W, H, 1);
        gl.uniform1f(uTime, t);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(frame);
      }
      frame();
    })();


    /* ── App ── */
    const API = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
      ? "http://localhost:8000"
      : "https://phishing-detector-b32k.onrender.com";

    async function analyze() {
      const text     = document.getElementById("emailInput").value.trim();
      const btn      = document.getElementById("analyzeBtn");
      const btnText  = document.getElementById("btnText");
      const spinner  = document.getElementById("spinner");
      const errorBox = document.getElementById("errorBox");
      const panel    = document.getElementById("resultPanel");
      const divider  = document.getElementById("divider");

      errorBox.style.display = "none";
      panel.style.display    = "none";
      divider.style.display  = "none";

      if (!text) { showError("Please paste some email text first."); return; }

      btn.disabled          = true;
      btnText.textContent   = "Analyzing...";
      spinner.style.display = "block";

      try {
        const res = await fetch(`${API}/predict`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) { const e = await res.json(); throw new Error(e.detail || "Server error"); }
        showResult(await res.json());
      } catch (e) {
        showError(e.name === "TypeError"
          ? "Could not reach the backend. Make sure the server is running."
          : e.message);
      } finally {
        btn.disabled          = false;
        btnText.textContent   = "Analyze Email";
        spinner.style.display = "none";
      }
    }

    function showResult(data) {
      const isPhishing = data.label === "phishing";
      const cls        = isPhishing ? "danger" : "success";

      document.getElementById("verdictLabel").className   = `verdict-label ${cls}`;
      document.getElementById("verdictLabel").textContent = isPhishing ? "Phishing Detected" : "Legitimate Email";
      document.getElementById("verdictConf").textContent  = `Confidence: ${data.confidence}%`;

      document.getElementById("verdictBadge").className   = `verdict-badge ${cls}`;
      document.getElementById("verdictBadge").textContent = isPhishing ? "High Risk" : "Safe";

      document.getElementById("phishingBar").style.width = data.phishing_probability + "%";
      document.getElementById("legitBar").style.width    = data.legitimate_probability + "%";
      document.getElementById("phishingPct").textContent = data.phishing_probability + "%";
      document.getElementById("legitPct").textContent    = data.legitimate_probability + "%";

      document.getElementById("divider").style.display    = "block";
      document.getElementById("resultPanel").style.display = "block";
    }

    function showError(msg) {
      const box = document.getElementById("errorBox");
      box.textContent   = msg;
      box.style.display = "block";
    }

    document.getElementById("emailInput").addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) analyze();
    });
  </script>
</body>
</html>
